# Talk as a Trindle plugin, interface 1.
[Plugin]
Interface=1
Id=org.trindle.Talk
Name=Talk
Version=1.0.0
Permissions=microphone;sound;network;notifications

[Ring]
Icon=talk.svg
Label=Talk: speak and see your words
Run=bin/talk ring

[Settings]
Fields=status;language;fillers;british;read_back;voice_supertonic;help_use;help_where;help_private

[Field status]
Kind=note
TextFrom=status.txt

[Field language]
Kind=choice
Label=Language you speak
Choices=Any language;English;Cymraeg;Dansk;Deutsch;Español;Français;Italiano;Nederlands;Norsk;Polski;Português;Suomi;Svenska;Türkçe;Русский;Українська;العربية;हिन्दी;日本語
Default=Any language

[Field fillers]
Kind=switch
Label=Leave out um and er
Default=true

[Field british]
Kind=switch
Label=British spelling
Default=true

[Field read_back]
Kind=switch
Label=Read back what Talk heard
Default=false

[Field voice_supertonic]
Kind=choice
Label=Reading voice
Choices=Female 1;Female 2;Female 3;Female 4;Female 5;Male 1;Male 2;Male 3;Male 4;Male 5
Default=Male 5
ShowWhen=read_back=true

[Field help_use]
Kind=note
Label=Press Talk in the ring, speak, then pause.

[Field help_where]
Kind=note
Label=Your words show under Talk's name in the ring.

[Field help_private]
Kind=note
Label=Listening happens on this computer only.
