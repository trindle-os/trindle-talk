# What cargo deny holds the dependencies to.
[graph]
targets = ["x86_64-unknown-linux-gnu"]

[advisories]
unmaintained = "workspace"
ignore = [
    { id = "RUSTSEC-2026-0367", reason = "zip 8.6 comes only through candle-core 0.11.0, which does not call extract; candle 0.11.1 (zip 9) does not build with Rust 1.93" },
    { id = "RUSTSEC-2026-0368", reason = "zip 8.6 comes only through candle-core 0.11.0, which does not call extract; candle 0.11.1 (zip 9) does not build with Rust 1.93" },
    { id = "RUSTSEC-2026-0369", reason = "zip 8.6 comes only through candle-core 0.11.0, which does not call extract; candle 0.11.1 (zip 9) does not build with Rust 1.93" },
    { id = "RUSTSEC-2026-0429", reason = "zip 8.6 comes only through candle-core 0.11.0, which does not call extract; candle 0.11.1 (zip 9) does not build with Rust 1.93" },
]

[licenses]
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "ISC",
    "0BSD",
    "BlueOak-1.0.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/trindle-os/trindle-toolkit",
    "https://github.com/trindle-os/trindle-voice",
]
