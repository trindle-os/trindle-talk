<!doctype html><meta charset=utf-8><style>
* { box-sizing: border-box; margin: 0; }
html, body { width: 1280px; height: 340px; }
body { background: #111827; font-family: "Trindle Sans", system-ui, sans-serif; color: #f4f6fb; display: flex; align-items: center; justify-content: center; gap: 28px; padding: 0 56px; }
.step { width: 330px; background: #1f2937; border-radius: 22px; padding: 30px 28px; height: 240px; }
.n { width: 44px; height: 44px; border-radius: 50%; background: #ff8a65; color: #111827; font-weight: 700; font-size: 22px; display: grid; place-items: center; }
h2 { font-size: 28px; font-weight: 600; margin-top: 20px; }
p { font-size: 19px; line-height: 1.4; color: #c3cad8; margin-top: 10px; }
.arrow { font-size: 40px; color: #ff8a65; }
</style>
<div class=step><div class=n>1</div><h2>Press Talk</h2><p>Click the Talk icon in the Trindle ring.</p></div>
<div class=arrow>&rarr;</div>
<div class=step><div class=n>2</div><h2>Speak, then pause</h2><p>Talk listens on your computer and stops when you stop.</p></div>
<div class=arrow>&rarr;</div>
<div class=step><div class=n>3</div><h2>Read your words</h2><p>They appear under Talk's name in the ring. Read back says them aloud.</p></div>
