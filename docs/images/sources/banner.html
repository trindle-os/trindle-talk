<!doctype html><meta charset=utf-8><style>
* { box-sizing: border-box; margin: 0; }
html, body { width: 1280px; height: 360px; }
body { background: #111827; font-family: "Trindle Sans", system-ui, sans-serif; color: #f4f6fb; position: relative; overflow: hidden; display: flex; align-items: center; gap: 56px; padding: 0 72px; }
.glow { position: absolute; inset: 0; background: radial-gradient(640px 420px at 88% 12%, rgba(255,138,101,.22), transparent 68%), radial-gradient(520px 380px at 6% 94%, rgba(94,182,255,.12), transparent 70%); }
.mark { position: relative; width: 150px; height: 150px; border-radius: 34px; background: #ff8a65; display: grid; place-items: center; flex: none; box-shadow: 0 18px 44px rgba(0,0,0,.5); }
.mark svg { width: 92px; height: 92px; }
.words { position: relative; }
h1 { font-size: 78px; font-weight: 600; letter-spacing: -.025em; line-height: 1; }
p { font-size: 26px; color: #c3cad8; margin-top: 14px; font-weight: 400; }
.chips { display: flex; gap: 10px; margin-top: 26px; }
.chip { font-size: 15px; font-weight: 600; padding: 8px 15px; border-radius: 999px; background: #1f2937; border: 1px solid rgba(255,255,255,.12); color: #e3e8f2; }
.chip.on { background: #4a2a1d; border-color: rgba(255,138,101,.5); color: #ffc4b0; }
</style>
<div class=glow></div>
<div class=mark><svg viewBox="0 0 24 24" fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2.5" width="6" height="12" rx="3" fill="#111827"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"/></svg></div>
<div class=words>
  <h1>Talk</h1>
  <p>Speak instead of typing. Your words appear in the Trindle ring.</p>
  <div class=chips>
    <span class="chip on">Listens on this computer</span>
    <span class=chip>Whisper base</span>
    <span class=chip>Optional read back</span>
  </div>
</div>
