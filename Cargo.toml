# Talk, the Trindle voice plugin.
[package]
name = "trindle-talk"
description = "Talk, Trindle's voice plugin: say something instead of typing it, with the words read back to you if you ask"
version = "1.0.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-or-later"

[[bin]]
name = "talk"
path = "src/main.rs"

[dependencies]
serde_json = "1"
trindle-common = { git = "https://github.com/trindle-os/trindle-toolkit", rev = "3b1e06bc4d4ccb94b9d7b876feecc37aa4765e74" }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[workspace]
